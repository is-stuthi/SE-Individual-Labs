<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Arial, Helvetica, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<rect width="1000" height="560" fill="#fff"/>
<text x="500" y="22" text-anchor="middle" font-size="17" font-weight="bold">Group Travel Expense Simplification Engine: Layered Architecture</text>
<!-- actors -->
<rect x="300" y="40" width="180" height="40" rx="6" fill="#fff3cd" stroke="#333"/><text x="390" y="65" text-anchor="middle">Group Traveler</text>
<rect x="520" y="40" width="180" height="40" rx="6" fill="#fff3cd" stroke="#333"/><text x="610" y="65" text-anchor="middle">Trip Admin</text>
<line x1="390" y1="80" x2="390" y2="108" stroke="#333" marker-end="url(#a)"/><line x1="610" y1="80" x2="610" y2="108" stroke="#333" marker-end="url(#a)"/>
<!-- client -->
<rect x="35" y="110" width="930" height="46" rx="6" fill="#dbeafe" stroke="#333"/><text x="500" y="138" text-anchor="middle">Presentation Layer: Web / Mobile Client (trip dashboard, expense form, balances, settlement view)</text>
<line x1="500" y1="156" x2="500" y2="184" stroke="#333" marker-end="url(#a)"/>
<!-- api -->
<rect x="35" y="186" width="930" height="46" rx="6" fill="#dbeafe" stroke="#333"/><text x="500" y="214" text-anchor="middle">API Layer: REST endpoints, authentication, role-based access control (Traveler / Admin), input validation</text>
<line x1="500" y1="232" x2="500" y2="262" stroke="#333" marker-end="url(#a)"/>
<!-- services -->
<text x="35" y="258" font-weight="bold">Application Services</text>
<g fill="#dcfce7" stroke="#333">
<rect x="35" y="266" width="170" height="96" rx="6"/><rect x="225" y="266" width="170" height="96" rx="6"/><rect x="415" y="266" width="170" height="96" rx="6"/><rect x="605" y="266" width="170" height="96" rx="6"/><rect x="795" y="266" width="170" height="96" rx="6"/></g>
<g text-anchor="middle">
<text x="120" y="292" font-weight="bold">Trip &amp; Member Service</text><text x="120" y="314">UC-01, UC-09</text><text x="120" y="334">FR-001</text>
<text x="310" y="292" font-weight="bold">Expense Service</text><text x="310" y="314">UC-02, UC-08</text><text x="310" y="334">FR-002</text>
<text x="500" y="292" font-weight="bold">Settlement Engine</text><text x="500" y="314">UC-04, UC-05</text><text x="500" y="334">FR-004, NFR-001, NFR-002</text>
<text x="690" y="292" font-weight="bold">Currency Conversion</text><text x="690" y="314">UC-03</text><text x="690" y="334">FR-003, NFR-002</text>
<text x="880" y="292" font-weight="bold">Payment Service</text><text x="880" y="314">UC-06, UC-07</text><text x="880" y="334">FR-005</text></g>
<!-- include arrow -->
<line x1="585" y1="350" x2="605" y2="350" stroke="#333" stroke-dasharray="4 2" marker-end="url(#a)"/>
<text x="595" y="378" text-anchor="middle" font-size="11">«include»</text>
<!-- data -->
<line x1="120" y1="362" x2="120" y2="420" stroke="#333" marker-end="url(#a)"/><line x1="310" y1="362" x2="310" y2="420" stroke="#333" marker-end="url(#a)"/><line x1="500" y1="362" x2="500" y2="420" stroke="#333" marker-end="url(#a)"/>
<rect x="35" y="422" width="570" height="60" rx="6" fill="#fde2e2" stroke="#333"/>
<text x="320" y="447" text-anchor="middle" font-weight="bold">Data Layer: Relational Database</text><text x="320" y="467" text-anchor="middle">trips, members, expenses, splits, exchange_rates, settlements, payments</text>
<!-- external -->
<line x1="690" y1="362" x2="715" y2="420" stroke="#333" marker-end="url(#a)"/><line x1="880" y1="362" x2="890" y2="420" stroke="#333" marker-end="url(#a)"/>
<rect x="640" y="422" width="150" height="60" rx="6" fill="#e5e7eb" stroke="#333" stroke-dasharray="5 3"/><text x="715" y="448" text-anchor="middle">Exchange Rate</text><text x="715" y="466" text-anchor="middle">Service (external)</text>
<rect x="815" y="422" width="150" height="60" rx="6" fill="#e5e7eb" stroke="#333" stroke-dasharray="5 3"/><text x="890" y="448" text-anchor="middle">Payment Gateway</text><text x="890" y="466" text-anchor="middle">(external)</text>
<text x="715" y="500" text-anchor="middle" font-size="11">daily rates (HTTPS)</text><text x="890" y="500" text-anchor="middle" font-size="11">payment confirmation (HTTPS)</text>
<!-- legend -->
<text x="35" y="530" font-size="11">Blue: client and API tiers | Green: application services (with mapped UCs and requirements) | Red: persistence | Grey dashed: external systems</text>
</svg>
